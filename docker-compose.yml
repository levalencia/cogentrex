services:
  api:
    build:
      context: .
      target: api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      API_PORT: 3001
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:3001}
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: sqlite:///data/cogentrex.sqlite
      JWT_SECRET: ${JWT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      WEB_SEARCH_ADAPTER: ${WEB_SEARCH_ADAPTER:-scrapling}
      WEB_FETCH_ADAPTER: ${WEB_FETCH_ADAPTER:-scrapling}
      SCRAPLING_BASE_URL: http://scrapling-fetcher:8000
      DEFAULT_PROVIDER_NAME: ${DEFAULT_PROVIDER_NAME:-Cogentrex Default}
      DEFAULT_PROVIDER_BASE_URL: ${DEFAULT_PROVIDER_BASE_URL}
      DEFAULT_PROVIDER_MODEL: ${DEFAULT_PROVIDER_MODEL}
    depends_on:
      - scrapling-fetcher
    volumes:
      - cogentrex-data:/data

  scrapling-fetcher:
    build:
      context: .
      dockerfile: services/scrapling-fetcher/Dockerfile
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    depends_on:
      - api

volumes:
  cogentrex-data:
