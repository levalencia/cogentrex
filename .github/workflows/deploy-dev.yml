name: Deploy to DEV

on:
  push:
    branches: [dev]

env:
  REGISTRY_LOGIN_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
  IMAGE_PREFIX: ${{ secrets.REGISTRY_LOGIN_SERVER }}/cogentrex
  DEV_API_BASE_URL: https://api.cogentrex.com
  DEV_WEB_ORIGIN: https://cogentrex.com,https://www.cogentrex.com,https://ca-cogentrex-web-dev.blacksmoke-54283d14.centralus.azurecontainerapps.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse Azure credentials
        id: azure-creds
        run: |
          CREDS='${{ secrets.AZURE_CREDENTIALS }}'
          echo "Raw creds length: ${#CREDS}"
          CLIENT_ID=$(echo "$CREDS" | jq -r '.clientId // .client_id // empty')
          TENANT_ID=$(echo "$CREDS" | jq -r '.tenantId // .tenant_id // empty')
          SUB_ID=$(echo "$CREDS" | jq -r '.subscriptionId // .subscription_id // empty')
          CLIENT_SECRET=$(echo "$CREDS" | jq -r '.clientSecret // .client_secret // empty')
          echo "client-id=$CLIENT_ID" >> $GITHUB_OUTPUT
          echo "tenant-id=$TENANT_ID" >> $GITHUB_OUTPUT
          echo "subscription-id=$SUB_ID" >> $GITHUB_OUTPUT
          echo "client-secret=$CLIENT_SECRET" >> $GITHUB_OUTPUT
          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ]; then
            echo "ERROR: Failed to parse AZURE_CREDENTIALS. Ensure it's valid JSON from 'az ad sp create-for-rbac'"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ steps.azure-creds.outputs.client-id }}
          tenant-id: ${{ steps.azure-creds.outputs.tenant-id }}
          subscription-id: ${{ steps.azure-creds.outputs.subscription-id }}
          client-secret: ${{ steps.azure-creds.outputs.client-secret }}

      - name: ACR Login
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.REGISTRY_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build and push API
        run: |
          docker build --platform linux/amd64 --target api -t $IMAGE_PREFIX-api:dev .
          docker push $IMAGE_PREFIX-api:dev

      - name: Build and push Web
        run: |
          docker build --platform linux/amd64 --target web \
            --build-arg NEXT_PUBLIC_API_BASE_URL=$DEV_API_BASE_URL \
            -t $IMAGE_PREFIX-web:dev .
          docker push $IMAGE_PREFIX-web:dev

      - name: Deploy API to Container Apps
        run: |
          az containerapp update \
            --name ca-cogentrex-api-dev \
            --resource-group rg-cogentrex-dev \
            --image $IMAGE_PREFIX-api:dev \
            --set-env-vars WEB_ORIGIN=$DEV_WEB_ORIGIN API_PUBLIC_BASE_URL=$DEV_API_BASE_URL

      - name: Deploy Web to Container Apps
        run: |
          az containerapp update \
            --name ca-cogentrex-web-dev \
            --resource-group rg-cogentrex-dev \
            --image $IMAGE_PREFIX-web:dev \
            --set-env-vars NEXT_PUBLIC_API_BASE_URL=$DEV_API_BASE_URL
